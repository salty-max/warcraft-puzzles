# The harness's config (docs: harness/docs/design.md in the harness repository).
[project]
name = "warcraft-puzzles"

[tools]
dir = "harness"

[defaults]
check = "pnpm check"
rules = "CLAUDE.md"

# [hooks]
# trailers = true   # refuse AI co-author / "generated with" trailers
# lock     = true   # a Claude session's commit wants its running card
# stamp    = true   # a push wants a passing check on the tree
# review   = true   # a push wants a recorded review

# Sonnet by default for every session session.ts opens. Opus only in the reviewer,
# architect and editor helpers (their own frontmatter), and for a desktop plan child,
# which starts on Opus as the child skill says.
[session]
models = { code = "sonnet", prose = "sonnet" }
